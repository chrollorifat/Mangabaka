<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <!-- 
    MODERN CYBER-GLASS DASHBOARD DESIGN
    Generated by MangaBaka Stats Card (Python Edition)
  -->
  
  <defs>
    <!-- Deep ocean gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Neon accent gradients -->
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    
    <!-- Soft glow filter for text and elements -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glassmorphism blur effect -->
    <filter id="glassBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>
    </pattern>
    
    <!-- Ambient light circles for depth -->
    <radialGradient id="ambient1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="ambient2">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="900" height="450" fill="url(#bg)" rx="16"/>
  
  <!-- Grid overlay for texture -->
  <rect width="900" height="450" fill="url(#grid)" rx="16"/>
  
  <!-- Ambient lighting effects (large blurred circles) -->
  <circle cx="720.0" cy="90.0" r="180" fill="url(#ambient1)" filter="url(#glassBlur)"/>
  <circle cx="270.0" cy="315.0" r="150" fill="url(#ambient2)" filter="url(#glassBlur)"/>
  
  <!-- Decorative corner accents -->
  <rect x="0" y="0" width="140" height="4" fill="url(#accent1)" rx="2"/>
  <rect x="0" y="0" width="4" height="140" fill="url(#accent1)" rx="2"/>
  <rect x="760" y="446" width="140" height="4" fill="url(#accent2)" rx="2"/>
  <rect x="896" y="310" width="4" height="140" fill="url(#accent2)" rx="2"/>
  
  <!-- ========== LEFT PANEL: Identity & Activity Chart ========== -->
  <g transform="translate(40, 50)">
    <!-- Avatar circle placeholder -->
    <circle cx="40" cy="40" r="35" fill="#ffffff" opacity="0.08" stroke="#38bdf8" stroke-width="2"/>
    <text x="40" y="50" text-anchor="middle" fill="#f1f5f9" font-size="32" font-weight="700" font-family="system-ui, sans-serif">T</text>
    
    <!-- Username -->
    <text x="0" y="95" fill="#f1f5f9" font-size="18" font-weight="700" font-family="system-ui, sans-serif" filter="url(#glow)">@test_user</text>
    <text x="0" y="115" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">MangaBaka Statistics</text>
    
    <!-- Hero Stat: Total Entries -->
    <rect x="0" y="135" width="180" height="65" rx="12" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="90" y="162" fill="#38bdf8" font-size="36" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">5</text>
    <text x="90" y="182" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="0.5">TOTAL ENTRIES</text>
    
    <!-- Donut Chart: Activity Distribution -->
    <text x="0" y="230" fill="#f1f5f9" font-size="12" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="0.5">ACTIVITY MIX</text>
    <g transform="translate(20, 245)">
      <circle cx="60" cy="60" r="44" fill="none" stroke="#334155" stroke-width="12"/>
    </g>
    
    <!-- Chart legend -->
    <g transform="translate(0, 375)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#38bdf8"/><text x="16" y="9" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Reading</text>
      <rect x="60" y="0" width="10" height="10" rx="2" fill="#2dd4bf"/><text x="76" y="9" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Done</text>
      <rect x="110" y="0" width="10" height="10" rx="2" fill="#fbbf24"/><text x="126" y="9" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Paused</text>
    </g>
  </g>
  
  <!-- ========== RIGHT PANEL: Metrics Grid ========== -->
  <g transform="translate(260, 50)">
    <!-- Top row: Chapters & Volumes -->
    <rect x="0" y="0" width="140" height="80" rx="12" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="70" y="28" fill="#2dd4bf" font-size="28" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">0</text>
    <text x="70" y="50" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">CHAPTERS</text>
    <text x="70" y="65" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Read</text>
    
    <rect x="155" y="0" width="140" height="80" rx="12" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="225" y="28" fill="#fbbf24" font-size="28" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">0</text>
    <text x="225" y="50" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">VOLUMES</text>
    <text x="225" y="65" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Collected</text>
    
    <!-- Middle row: Score & Rereads -->
    <rect x="0" y="95" width="140" height="80" rx="12" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="70" y="123" fill="#fb7185" font-size="32" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">0.0</text>
    <text x="70" y="145" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">AVG SCORE</text>
    <text x="70" y="160" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">/ 10.0</text>
    
    <rect x="155" y="95" width="140" height="80" rx="12" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="225" y="123" fill="#818cf8" font-size="28" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">0</text>
    <text x="225" y="145" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">REREADS</text>
    <text x="225" y="160" fill="#64748b" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Favorites</text>
    
    <!-- Currently Reading highlight -->
    <rect x="0" y="190" width="295" height="55" rx="12" fill="url(#accent1)" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="215" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, sans-serif">CURRENTLY READING</text>
    <text x="275" y="215" fill="#38bdf8" font-size="24" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">0</text>
    <text x="275" y="230" fill="#94a3b8" font-size="9" text-anchor="end" font-family="system-ui, sans-serif">titles in progress</text>
  </g>
  
  <!-- ========== BOTTOM SECTION: Genre Tags ========== -->
  <g transform="translate(40, 405)">
    <text x="0" y="0" fill="#f1f5f9" font-size="11" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="0.5">FAVORITE GENRES</text>
    <g transform="translate(0, 12)">
      
    </g>
  </g>
  
  <!-- ========== FOOTER ========== -->
  <text x="40" y="432" fill="#64748b" font-size="9" font-family="system-ui, sans-serif" opacity="0.5">MangaBaka - Jul 31, 2026</text>
  <text x="860" y="432" fill="#64748b" font-size="9" text-anchor="end" font-family="system-ui, sans-serif" opacity="0.5">Auto-generated on GitHub Actions</text>
</svg>