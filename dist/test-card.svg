            <text x="20" y="25" font-size="13" fill="#94a3b8" font-weight="600" letter-spacing="0.5">COMPLETION RATE</text>
            <text x="20" y="55" class="metric-main">39.8%</text>
            <text x="20" y="72" class="metric-sub">47/118</text>
        </g>
        
        <g transform="translate(420, 660)">
            <rect width="340" height="80" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
            <text x="20" y="25" font-size="13" fill="#94a3b8" font-weight="600" letter-spacing="0.5">SUCCESS RATIO</text>
            <text x="20" y="55" class="metric-main">68.1%</text>
            <text x="20" y="72" class="metric-sub">Completed vs Dropped</text>
        </g>
        
        <g transform="translate(780, 660)">
            <rect width="340" height="80" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
            <text x="20" y="25" font-size="13" fill="#94a3b8" font-weight="600" letter-spacing="0.5">AVG CHAPS/DAY</text>
            <text x="20" y="55" class="metric-main">455.83</text>
            <text x="20" y="72" class="metric-sub">Last 30 Days</text>
        </g>
        
