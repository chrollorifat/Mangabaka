            <text x="20" y="35" class="card-label">REREADS</text>
            <text x="20" y="65" class="card-value">1</text>
        </g>
        
    <g transform="translate(0, 280)">
        <text x="60" y="0" class="section-title">TOP GENRES</text>
        
        <g transform="translate(60, 0)">
