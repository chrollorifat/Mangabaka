<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="100%" height="auto" font-family="'Segoe UI', Roboto, sans-serif">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e1b4b"/>
        </linearGradient>
        
        <!-- Accent Gradient (Blue to Purple) -->
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>
        
        <!-- Glow Filter for Ambient Effects -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Text Styles -->
        <style>
            .section-title { font-size: 18px; fill: #f8fafc; font-weight: bold; }
            .card-label { font-size: 14px; fill: #94a3b8; font-weight: 600; }
            .card-value { font-size: 32px; fill: url(#accentGrad); font-weight: bold; }
            .metric-main { font-size: 26px; fill: #f8fafc; font-weight: bold; }
            .metric-sub { font-size: 13px; fill: #94a3b8; }
            .bar-label { font-size: 14px; fill: #94a3b8; }
            .bar-value { font-size: 14px; fill: #f8fafc; font-weight: bold; }
        </style>
    </defs>
    <rect width="100%" height="100%" fill="url(#bgGrad)"/><circle cx="150" cy="150" r="200" fill="#818cf8" opacity="0.12" filter="url(#glow)"/><circle cx="1050" cy="760" r="250" fill="#c084fc" opacity="0.10" filter="url(#glow)"/>
    <g transform="translate(0, 20)">
        <!-- Main Title -->
        <text x="60" y="0" font-size="42" font-weight="bold" fill="#f8fafc">MangaBaka Stats</text>
        <text x="60" y="35" font-size="18" fill="#94a3b8">Comprehensive Library Analytics</text>
        
        <!-- Decorative Separator Line -->
        <line x1="60" y1="55" x2="940" y2="55" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
        
        <!-- Avatar Circle -->
        <circle cx="90" cy="110" r="28" fill="url(#accentGrad)"/>
        <text x="90" y="120" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">C</text>
        
        <!-- Username -->
        <text x="135" y="105" font-size="24" font-weight="600" fill="#f8fafc">@Cold</text>
        <text x="135" y="130" font-size="16" fill="#94a3b8">Total Entries: 118</text>
        
        <!-- Mini Donut Chart (Right Side) -->
        <g transform="translate(1040, 40)">
            <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(148, 163, 184, 0.1)" stroke-width="10"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="10" 
                    stroke-dasharray="220 314" stroke-linecap="round" transform="rotate(-90 60 60)"/>
            <text x="60" y="65" text-anchor="middle" font-size="14" fill="#f8fafc">Active</text>
        </g>
    </g>
    
        <g transform="translate(60, 160)">
            <rect width="240" height="90" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
            <text x="20" y="35" class="card-label">CHAPTERS READ</text>
            <text x="20" y="65" class="card-value">13,674</text>
        </g>
        
        <g transform="translate(320, 160)">
            <rect width="240" height="90" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
            <text x="20" y="35" class="card-label">VOLUMES READ</text>
            <text x="20" y="65" class="card-value">293</text>
        </g>
        
        <g transform="translate(580, 160)">
